# Declared second band of the comparison protocol: 1 to 70 Hz with the 60 Hz notch.
# Every other setting equals configs/tuev.toml. A manifest holds one band, so this
# file needs its own manifest directory and its own recording cache entries.

[preprocessing]
input_mode = "referential"
target_sfreq = 250.0
highpass_hz = 1.0
lowpass_hz = 70.0
notch_hz = [60.0]
missing_channels = "error"
normalization = "mad"
normalization_scope = "recording"
clip = 50.0
channels = [
  "FP1-F7", "F7-T3", "T3-T5", "T5-O1",
  "FP2-F8", "F8-T4", "T4-T6", "T6-O2",
  "A1-T3", "T3-C3", "C3-CZ", "CZ-C4", "C4-T4", "T4-A2",
  "FP1-F3", "F3-C3", "C3-P3", "P3-O1",
  "FP2-F4", "F4-C4", "C4-P4", "P4-O2",
]

[examples]
before_seconds = 2.0
after_seconds = 3.0
unit = "interval"
edge_policy = "drop"
conflict_policy = "background_yields"
displaced_controls = true
displaced_gap_seconds = 10.0

[splits]
n_folds = 5
seed = 42
stratify = "class_presence"
eval_cluster = "session"
duplicate_content = "merge"
