[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "eeg-waveform-comparison"
version = "0.1.0"
description = "Reusable reference core for a controlled EEG waveform comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7,<1",
    "mne>=1.11,<2",
    "numpy>=1.26,<3",
    "orjson>=3.10,<4",
    "polars>=1.34,<2",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "threadpoolctl>=3.1,<4",
    "torch==2.6.0",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = ["mypy>=1.11", "packaging>=24", "pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
eeg-tuev = "eeg_compare.data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/eeg_compare"]
ignore_missing_imports = true
check_untyped_defs = true
